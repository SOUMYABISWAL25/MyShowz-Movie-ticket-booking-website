<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Upload - MyShowz</title>
    <link rel="stylesheet" type="text/css" href="assets/css/as-alert-message.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/contact_us.css">
    <link rel="stylesheet" type="text/css" href="assets/css/style-starter.css">
    <style>
        body {
            background: transparent;
            padding: 20px;
        }

        .container {
            margin-top: 0 !important;
        }

        .file-feedback {
            font-size: 15px;
            color: #4CAF50 !important;
            margin-top: 10px;
            display: block;
            font-weight: 700;
            padding: 8px 0;
            background: rgba(76, 175, 80, 0.1);
            border-left: 3px solid #4CAF50;
            padding-left: 10px;
        }

        .file-note {
            font-size: 11px;
            color: #FFB74D;
            display: block;
            margin-top: 5px;
            font-style: italic;
        }

        /* Category dropdown styling */
        #category {
            width: 100%;
            padding: 12px 10px;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #fff !important;
            outline: none;
            font-size: 16px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        #category:focus {
            border-bottom-color: #d63447;
        }

        #category option {
            background: #1a1a1a;
            color: #fff;
            padding: 10px;
        }

        #category option:disabled {
            color: #888;
        }

        /* File input styling */
        input[type="file"] {
            color: #fff !important;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: #d63447;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 15px;
            font-weight: 600;
        }

        input[type="file"]::file-selector-button:hover {
            background: #c02a3a;
        }
    </style>
</head>

<body>
    <!-- Admin Upload Form -->
    <div class="container">
        <form id="uploadForm" class="signin-form">
            <div class="row100">
                <div class="col">
                    <div class="inputBox">
                        <input type="text" name="title" id="title" required />
                        <span class="text">Movie Title</span>
                        <span class="line"></span>
                    </div>
                </div>
            </div>
            <div class="row100">
                <div class="col">
                    <div class="inputBox textarea">
                        <textarea name="description" id="description" required></textarea>
                        <span class="text">Description</span>
                        <span class="line"></span>
                    </div>
                </div>
            </div>
            <div class="row100">
                <div class="col">
                    <div class="inputBox">
                        <select name="category" id="category" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Latest Movies">Latest Movies</option>
                            <option value="Kids">Kids</option>
                            <option value="Popular Movies">Popular Movies</option>
                            <option value="Trend Movies">Trend Movies</option>
                        </select>
                        <span class="text" style="top: -20px; font-size: 12px; color: #aaa;">Category</span>
                        <span class="line"></span>
                    </div>
                </div>
            </div>
            <div class="row100">
                <div class="col">
                    <div class="inputBox">
                        <input type="file" name="posterImage" id="posterImage" accept="image/*" required
                            style="padding-top: 10px;" />
                        <span class="text" style="top: -20px; font-size: 12px; color: #aaa;">Movie Poster Image</span>
                        <span class="line"></span>
                        <span id="posterFeedback" class="file-feedback"></span>
                    </div>
                </div>
            </div>
            <div class="row100">
                <div class="col">
                    <div class="inputBox">
                        <input type="file" name="movieFile" id="movieFile"
                            accept="video/mp4,video/x-m4v,video/*,.mp4,.mkv,.avi,.mov,.wmv,.flv,.webm" required
                            style="padding-top: 10px;" />
                        <span class="text" style="top: -20px; font-size: 12px; color: #aaa;">
                            Movie File - All formats: MP4, MKV, AVI, MOV, WMV (Up to 5GB)
                        </span>
                        <span class="line"></span>
                        <span id="fileFeedback" class="file-feedback"></span>
                        <span class="file-note">
                            ⚠️ Large files (2-3GB) supported! May take a few seconds to load after selection.
                        </span>
                    </div>
                </div>
            </div>
            <div class="row100">
                <div class="col">
                    <div class="submitbutton">
                        <button class="btn submitbtn" type="submit">Upload Movie</button>
                    </div>
                </div>
            </div>
            <div id="uploadStatus" class="mt-3 text-center" style="margin-top: 20px;"></div>
        </form>
    </div>

    <script src="assets/js/bundles/admin-upload.js"></script>
    <script src="assets/js/jquery-3.3.1.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
</body>

</html>
