<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Upload - MyShowz</title>
    <link rel="stylesheet" type="text/css" href="assets/css/as-alert-message.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/contact_us.css">
    <link rel="stylesheet" type="text/css" href="assets/css/style-starter.css">
</head>

<body>
    <header id="site-header" class="w3l-header fixed-top">
        <!--/nav-->
        <nav class="navbar navbar-expand-lg navbar-light fill px-lg-0 py-0 px-3">
            <div class="container">
                <h1><a class="navbar-brand" href="index.html"><span class="fa fa-play icon-log"
                            aria-hidden="true"></span>
                        MyShowz </a></h1>
                <button class="navbar-toggler collapsed" type="button" data-toggle="collapse"
                    data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="fa icon-expand fa-bars"></span>
                    <span class="fa icon-close fa-times"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="movies.html">Movies</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Contact_Us.html">Contact</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="movies_download.html">Downloads</a>
                        </li>
                        <li class="nav-item active">
                            <a class="nav-link" href="admin_upload.html">Admin Panel</a>
                        </li>
                    </ul>

                    <div class="Login_SignUp" id="login"
                        style="font-size: 2rem ; display: inline-block; position: relative;">
                        <a class="nav-link" href="sign_in.html"><i class="fa fa-user-circle-o"></i></a>
                    </div>
                </div>
                <div class="mobile-position">
                    <nav class="navigation">
                        <div class="theme-switch-wrapper">
                            <label class="theme-switch" for="checkbox">
                                <input type="checkbox" id="checkbox">
                                <div class="mode-container">
                                    <i class="gg-sun"></i>
                                    <i class="gg-moon"></i>
                                </div>
                            </label>
                        </div>
                    </nav>
                </div>
            </div>
        </nav>
    </header>

    <!-- Admin Upload Form -->
    <div class="container" style="margin-top: 100px;">
        <h4>Admin Panel</h4>
        <h3>Upload Movie</h3>
        <p>Upload a new movie to the platform.</p>

        <form id="uploadForm" class="signin-form">
            <div class="row100">
                <div class="col">
                    <div class="inputBox">
                        <input type="text" name="title" id="title" required />
                        <span class="text">Movie Title</span>
                        <span class="line"></span>
                    </div>
                </div>
            </div>
            <div class="row100">
                <div class="col">
                    <div class="inputBox textarea">
                        <textarea name="description" id="description" required></textarea>
                        <span class="text">Description</span>
                        <span class="line"></span>
                    </div>
                </div>
            </div>
            <div class="row100">
                <div class="col">
                    <div class="inputBox">
                        <input type="file" name="posterImage" id="posterImage" accept="image/*" required
                            style="padding-top: 10px;" />
                        <span class="text" style="top: -20px; font-size: 12px; color: #aaa;">Movie Poster Image</span>
                        <span class="line"></span>
                    </div>
                </div>
            </div>
            <div class="row100">
                <div class="col">
                    <div class="inputBox">
                        <input type="file" name="movieFile" id="movieFile" accept="video/*" required
                            style="padding-top: 10px;" />
                        <span class="text" style="top: -20px; font-size: 12px; color: #aaa;">Movie File</span>
                        <span class="line"></span>
                    </div>
                </div>
            </div>
            <div class="row100">
                <div class="col">
                    <div class="submitbutton">
                        <button class="btn submitbtn" type="submit">Upload Movie</button>
                    </div>
                </div>
            </div>
            <div id="uploadStatus" class="mt-3 text-center" style="margin-top: 20px;"></div>
        </form>
    </div>

    <script src="assets/js/bundles/admin-upload.js"></script>
    <script src="assets/js/jquery-3.3.1.min.js"></script>
    <script src="assets/js/theme-change.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script>
        $(function () {
            $('.navbar-toggler').click(function () {
                $('body').toggleClass('noscroll');
            })
        });
        $(window).on("scroll", function () {
            var scroll = $(window).scrollTop();
            if (scroll >= 80) {
                $("#site-header").addClass("nav-fixed");
            } else {
                $("#site-header").removeClass("nav-fixed");
            }
        });
        $(".navbar-toggler").on("click", function () {
            $("header").toggleClass("active");
        });
    </script>
</body>

</html>
